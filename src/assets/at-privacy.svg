<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fe"/>
      <stop offset="1" stop-color="#dfe8fc"/>
    </linearGradient>
    <linearGradient id="pShieldFront" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7ba0f5"/>
      <stop offset="1" stop-color="#3f63e0"/>
    </linearGradient>
    <linearGradient id="pShieldSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7fee"/>
      <stop offset="1" stop-color="#2e4fcf"/>
    </linearGradient>
    <linearGradient id="pTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9effc"/>
    </linearGradient>
    <linearGradient id="pRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4d4f8"/>
      <stop offset="1" stop-color="#8aa8f2"/>
    </linearGradient>
    <radialGradient id="pDisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfddfb"/>
      <stop offset="1" stop-color="#aec5f5"/>
    </radialGradient>
    <filter id="pSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2c47b0" flood-opacity="0.18"/>
    </filter>
    <filter id="pTileSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3958c8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rounded panel background -->
  <rect x="20" y="20" width="440" height="440" rx="48" fill="url(#pBg)"/>

  <!-- base disc / platform -->
  <ellipse cx="240" cy="356" rx="120" ry="34" fill="url(#pDisc)" opacity="0.9"/>
  <ellipse cx="240" cy="356" rx="78" ry="20" fill="#bcd0f7"/>
  <ellipse cx="240" cy="354" rx="48" ry="12" fill="#aac3f4"/>

  <!-- curved arrow ring around the shield -->
  <g filter="url(#pSoft)">
    <path d="M120 300c-26-44-12-104 44-128" stroke="url(#pRing)" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M360 300c26-44 12-104-44-128" stroke="url(#pRing)" stroke-width="24" fill="none" stroke-linecap="round"/>
  </g>
  <!-- arrow heads -->
  <path d="M158 168l16-2 0 18z" fill="#8aa8f2"/>
  <path d="M322 168l-16-2 0 18z" fill="#8aa8f2"/>

  <!-- shield -->
  <g filter="url(#pSoft)">
    <!-- side/back face for depth -->
    <path d="M240 96l92 34v74c0 70-44 112-92 134-6-3-12-6-18-10 36-26 62-66 62-124v-74l-46-17z" fill="url(#pShieldSide)"/>
    <!-- front face -->
    <path d="M240 96l-92 34v74c0 70 44 112 92 134 48-22 92-64 92-134v-74l-92-34z" fill="url(#pShieldFront)"/>
    <!-- glossy highlight -->
    <path d="M240 110l-78 29v63c0 44 20 76 46 98 4-2 8-4 12-7-20-22-34-50-34-86v-66l54-20z" fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- lock on the shield -->
  <rect x="206" y="196" width="68" height="56" rx="12" fill="#ffffff"/>
  <path d="M218 196v-12a22 22 0 0 1 44 0v12" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="240" cy="220" r="9" fill="#3f63e0"/>
  <path d="M236 240l3 3 6-7" stroke="#3f63e0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="237" y="224" width="6" height="12" rx="3" fill="#3f63e0"/>

  <!-- floating UI tiles (each a different accent colour) -->
  <!-- list tile (left upper) — purple -->
  <g filter="url(#pTileSh)">
    <rect x="78" y="150" width="60" height="46" rx="12" fill="#f3f0fe"/>
  </g>
  <rect x="90" y="163" width="14" height="6" rx="3" fill="#7c3aed"/>
  <rect x="108" y="163" width="20" height="6" rx="3" fill="#dccffb"/>
  <rect x="90" y="177" width="14" height="6" rx="3" fill="#7c3aed"/>
  <rect x="108" y="177" width="20" height="6" rx="3" fill="#dccffb"/>

  <!-- lock tile (left lower) — green -->
  <g filter="url(#pTileSh)">
    <rect x="92" y="300" width="52" height="52" rx="13" fill="#eafaf3"/>
  </g>
  <rect x="108" y="320" width="20" height="16" rx="4" fill="#10b981"/>
  <path d="M111 320v-4a7 7 0 0 1 14 0v4" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- lock tile (right upper) — orange -->
  <g filter="url(#pTileSh)">
    <rect x="318" y="118" width="50" height="50" rx="13" fill="#fef3e6"/>
  </g>
  <rect x="333" y="137" width="20" height="15" rx="4" fill="#f59e0b"/>
  <path d="M336 137v-3a7 7 0 0 1 14 0v3" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- password dots tile (right top) — teal/cyan -->
  <g filter="url(#pTileSh)">
    <rect x="320" y="60" width="84" height="34" rx="11" fill="#e6faf9"/>
  </g>
  <g fill="#06b6d4">
    <circle cx="334" cy="77" r="4"/><circle cx="348" cy="77" r="4"/><circle cx="362" cy="77" r="4"/><circle cx="376" cy="77" r="4"/><circle cx="390" cy="77" r="4"/>
  </g>

  <!-- fingerprint tile (right lower) — pink -->
  <g filter="url(#pTileSh)">
    <rect x="330" y="232" width="54" height="54" rx="14" fill="#fdecf4"/>
  </g>
  <g stroke="#db2777" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M357 248a11 11 0 0 1 11 11v8"/>
    <path d="M357 248a11 11 0 0 0-11 11v6a16 16 0 0 0 2 8"/>
    <path d="M357 256a3 3 0 0 1 3 3v9"/>
    <path d="M357 256a3 3 0 0 0-3 3v6"/>
  </g>

  <!-- cursor near base -->
  <path d="M318 320l4 22 6-9 10 2z" fill="#3f63e0"/>
